name: Sobot
description: >-
  Sobot is an all-in-one AI-powered contact center and customer engagement
  platform used by more than 100,000 companies worldwide. Its products span an
  omnichannel Live Chat workspace, a multilingual AI Chatbot, cloud Voice /
  call-center with global numbers, a collaborative Ticketing system, a WhatsApp
  Business API, and outbound Voicebot / telemarketing. Sobot exposes developer
  APIs for online chat sessions, agent and department management, and voice
  extension administration, plus first-party SDKs for Android, iOS, HarmonyOS
  NEXT, Flutter, and Web (JavaScript) so teams can embed chat, voice, and
  ticketing into their own applications. The developer surface is documented on
  a Mintlify docs site and secured with HTTP bearer tokens.
