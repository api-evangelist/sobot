note: >-
  Sobot APIs return errors through a status envelope rather than HTTP
  problem+json. The published OpenAPI specs declare success responses only
  (mostly 200 / "No Content") and do not enumerate a per-operation 4xx/5xx
  error table, so individual error codes are not published in the spec. This
  catalog records the error CHANNEL (the envelope fields that carry status)
  derived from the spec component schemas; enrich with the docs error
  reference when Sobot publishes one.
