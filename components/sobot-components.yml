    description: JavaScript SDK that embeds click-to-call / softphone capability in the browser.
  - name: Call Capability (UI Phone Bar)
    kind: prebuilt-ui
    url: https://docs.sobot.io/build-apps/web/callphoneui
    description: Prebuilt phone-bar UI component for agents to place and receive calls.
