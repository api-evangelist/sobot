note: >-
  Sobot ships embeddable, client-side web components for dropping live chat,
  voice, and ticketing surfaces into a host web page — distinct from the
  server-side SDKs in packages/. Documented under docs.sobot.io/build-apps/web.
families:
- name: Online Chat
  components:
